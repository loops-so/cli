name: vuln

on:
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm install -g @go-task/cli
      - run: task vuln
